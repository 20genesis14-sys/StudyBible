[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # bzip2-1.0.6 (Julian Seward и др.) — пермиссивная BSD-подобная
    # лицензия распаковщика bzip2, который тянет `zip` 9.x
    # (`libbz2-rs-sys` ← `bzip2`). Нужна для чтения ZIP-архивов со
    # сжатием bzip2: импорт BibleQuote и импорт пользовательских данных.
    "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
