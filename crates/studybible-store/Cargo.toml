[package]
name = "studybible-store"
description = "Хранилище StudyBible: чтение и запись модулей SQLite, кэш поиска"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
studybible-core.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "2.2", default-features = false }
ruzstd = "0.9.0"
brotli-decompressor = "6.0.1"

[dev-dependencies]
studybible-convert.workspace = true
tempfile = "3"

[lints]
workspace = true
