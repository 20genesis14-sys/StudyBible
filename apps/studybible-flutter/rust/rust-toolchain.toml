[toolchain]
# native_toolchain_rust требует точную версию канала для воспроизводимых сборок.
# Не ниже rust-version workspace (1.99); перечисляем только цели, которые реально
# собираем — остальные добавляются сюда по мере появления платформ.
channel = "1.99.0"
targets = [
  "x86_64-unknown-linux-gnu",
  # Windows: тесты и debug-сборка Flutter на рабочем столе.
  "x86_64-pc-windows-msvc",
  # Android: все ABI — эмуляторы x86/x86_64 и устройства armv7/arm64.
  "x86_64-linux-android",
  "i686-linux-android",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
]
