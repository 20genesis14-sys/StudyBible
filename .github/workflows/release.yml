name: Release builds

# Сборка релизных артефактов по тегу v* (или вручную).
#
# Окружение намеренно повторяет рецепт fdroiddata (metadata/dev.studybible.yml):
# тот же коммит Flutter, та же версия Rust, тот же NDK — тогда APK из CI
# побайтно совпадают со сборкой F-Droid buildserver и проходят fdroid verify.
#
# Нужные secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    — base64 файла studybible-release.jks
#   KEYSTORE_PASSWORD  — пароль хранилища
#   KEY_ALIAS          — алиас ключа
#   KEY_PASSWORD       — пароль ключа

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Версия Flutter — единый источник правды; F-Droid-рецепт читает её
  # отсюда же (см. templates/build-flutter.yml в fdroiddata).
  # Тег 3.47.6 = коммит 5fc346839b5d0eef006ed8404392afb4dfae428d.
  flutter-version: '3.47.6'
  RUST_VERSION: '1.99.0'
  NDK_VERSION: '28.2.13676358'

jobs:
  # ---------------------------------------------------------------
  # Android: три per-ABI APK (armv7/arm64/x86_64), versionCode
  # выводится из pubspec (+N -> N*1000 + {1,2,3}).
  # ---------------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK (pinned)
        uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "ndk;${{ env.NDK_VERSION }}" "build-tools;36.0.0"

      - name: Flutter SDK @ pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$HOME/flutter"
          cd "$HOME/flutter"
          git fetch --depth 1 origin "${{ env['flutter-version'] }}"
          git checkout FETCH_HEAD
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --android

      - name: Rust toolchain + android targets
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          cat > apps/studybible-flutter/android/key.properties <<EOF
          storeFile=$HOME/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build ABI APKs
        env:
          PATH: "$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          CARGO_BUILD_JOBS: '4'
        run: |
          cd apps/studybible-flutter
          BASE=$(grep '^version:' pubspec.yaml | sed 's/.*+\([0-9]*\)/\1')
          flutter build apk --release --target-platform android-arm   --build-number=${BASE}001
          mv build/app/outputs/flutter-apk/app-release.apk /tmp/dev.studybible_${BASE}001.apk
          flutter build apk --release --target-platform android-arm64 --build-number=${BASE}002
          mv build/app/outputs/flutter-apk/app-release.apk /tmp/dev.studybible_${BASE}002.apk
          flutter build apk --release --target-platform android-x64   --build-number=${BASE}003
          mv build/app/outputs/flutter-apk/app-release.apk /tmp/dev.studybible_${BASE}003.apk
          ls -la /tmp/dev.studybible_*.apk

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          for f in /tmp/dev.studybible_*.apk; do
            gh release upload "$TAG" "$f" --clobber
          done

  # ---------------------------------------------------------------
  # Windows x64 zip
  # ---------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK @ pinned commit
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$HOME/flutter"
          cd "$HOME/flutter"
          git fetch --depth 1 origin "${{ env['flutter-version'] }}"
          git checkout FETCH_HEAD
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --windows

      - name: Rust toolchain (msvc)
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add x86_64-pc-windows-msvc

      - name: Build Windows release + zip
        shell: bash
        env:
          PATH: "$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          CARGO_BUILD_JOBS: '4'
        run: |
          cd apps/studybible-flutter
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          flutter build windows --release
          cd build/windows/x64/runner
          mv Release "StudyBible-${VER}-windows-x64"
          powershell -Command "Compress-Archive -Path 'StudyBible-${VER}-windows-x64' -DestinationPath '/tmp/StudyBible-${VER}-windows-x64.zip'"
          ls -la /tmp/*.zip

      - name: Upload Windows zip to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          gh release upload "$TAG" /tmp/StudyBible-*-windows-x64.zip --clobber

  # ---------------------------------------------------------------
  # Web bundle zip
  # ---------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK @ pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$HOME/flutter"
          cd "$HOME/flutter"
          git fetch --depth 1 origin "${{ env['flutter-version'] }}"
          git checkout FETCH_HEAD
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --web

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}

      - name: Build web bundle + zip
        env:
          PATH: "$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
        run: |
          cd apps/studybible-flutter
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          flutter build web --release
          cd build
          mv web "StudyBible-${VER}-web"
          zip -qr "/tmp/StudyBible-${VER}-web.zip" "StudyBible-${VER}-web"
          ls -la /tmp/*.zip

      - name: Upload web zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          gh release upload "$TAG" /tmp/StudyBible-*-web.zip --clobber
