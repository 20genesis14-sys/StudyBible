# Релизная сборка: Android (3 ABI), Windows x64, Web.
# Запускается по пушу тега v* или вручную (workflow_dispatch).
# Собранные артефакты прикрепляются к GitHub Release этого тега.
#
# Секреты (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64 — android-кеystore в base64
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD — параметры подписи
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  RUST_VERSION: '1.99.0'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Ключ подписи из секретов
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > apps/studybible-flutter/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: APK по ABI
        working-directory: apps/studybible-flutter
        run: flutter build apk --release --split-per-abi
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apps/studybible-flutter/build/app/outputs/flutter-apk/app-*-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: echo "RUSTC_WRAPPER=sccache" | Out-File -Append $env:GITHUB_ENV

      - name: Windows x64
        working-directory: apps/studybible-flutter
        run: flutter build windows --release

      - name: Упаковать
        working-directory: apps/studybible-flutter/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/studybible-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: studybible-windows-x64.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Web (WASM)
        working-directory: apps/studybible-flutter
        run: flutter build web --release

      - name: Упаковать
        working-directory: apps/studybible-flutter/build/web
        run: zip -qr "$GITHUB_WORKSPACE/studybible-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: studybible-web.zip

  release:
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apks/*.apk
            windows-zip/*.zip
            web-zip/*.zip
          generate_release_notes: true
