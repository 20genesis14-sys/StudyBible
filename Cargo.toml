[workspace]
resolver = "3"
members = [
    "crates/studybible-core",
    "crates/studybible-convert",
    "crates/studybible-store",
    "crates/studybible-accent",
    "apps/studybible-cli",
    # FFI-мост Flutter↔ядро (flutter_rust_bridge); живёт внутри приложения.
    "apps/studybible-flutter/rust",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["StudyBible contributors"]
publish = false

[workspace.dependencies]
studybible-core = { path = "crates/studybible-core" }
studybible-convert = { path = "crates/studybible-convert" }
studybible-store = { path = "crates/studybible-store" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
